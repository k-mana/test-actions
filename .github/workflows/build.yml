name: Build

on: 
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag pico-mruby-dev

      - name: Build pico-mruby
        run: docker run --mount type=bind,source="$(pwd)"/,target=/work pico-mruby-dev /bin/bash -c "cmake -G Ninja -B build && cmake --build build"

      - name: Archive
        run: |
          mkdir -p ${{ github.workspace }}/artifact/hello_world2
          cp build/src/hello_world/hello_world.uf2 ${{ github.workspace }}/artifact/hello_world2
          mkdir -p ${{ github.workspace }}/artifact/pico_mirb
          cp build/src/pico_mirb/pico-mirb.uf2 ${{ github.workspace }}/artifact/pico_mirb
          mkdir -p ${{ github.workspace }}/artifact/pico_mruby
          cp build/src/pico_mruby/pico-mruby.uf2 ${{ github.workspace }}/artifact/pico_mruby

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-binary
          path: ${{ github.workspace }}/artifact
